name: Production CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Lint (ALL branches)
      - name: Lint code
        run: npm run lint

      # 5. Type check (ALL branches)
      - name: Type check
        run: npm run type-check

      # 6. Unit tests (develop + main)
      - name: Run unit tests
        run: npm test -- --watch=false

      # 7. Production build (MAIN only)
      - name: Build for production
        if: github.ref == 'refs/heads/main'
        run: npm run build
